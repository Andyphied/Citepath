# AtlasOps AI local stack — API, worker, web UI, PostgreSQL (pgvector), Redis.
# Fresh clone: docker compose up --build
# Web UI: http://localhost:3000  API: http://localhost:8000
# Optional Flower (local Celery UI): docker compose --profile flower up --build
# Optional: cp .env.example .env to override defaults (Compose interpolates from shell / .env).
# Operator overrides:
#   OPENAI_API_KEY  ANTHROPIC_API_KEY  LLM_PROVIDER
#   WORKER_HEARTBEAT_INTERVAL_SECONDS  CELERY_DEFAULT_QUEUE
# Live seed + RAG demo require a real provider key (placeholder is boot-only).

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg2://atlasops:atlasops@postgres:5432/atlasops
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: dev-only-change-me-in-production
  STORAGE_BACKEND: local
  STORAGE_PATH: /uploads
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dev-placeholder-not-used-locally}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ENVIRONMENT: development
  LOG_LEVEL: INFO
  # OBS-007: worker structured heartbeat + Redis LLEN key for /health/ready.queue_depth
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-300}
  CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-celery}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlasops
      POSTGRES_PASSWORD: atlasops
      POSTGRES_DB: atlasops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlasops -d atlasops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      <<: *app-environment
    volumes:
      - ./app:/app/app
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    # Concurrency 2 matches ADR-004 / ECS worker command. Heartbeat uses WORKER_*.
    command: celery -A app.infrastructure.celery_app worker -l info -c 2
    environment:
      <<: *app-environment
    volumes:
      - ./app:/app/app
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional local Celery debug UI (OBS-007). Not used in production.
  # Enable: docker compose --profile flower up
  # Binds host :5555 without Flower auth — local/dev only; do not expose publicly.
  flower:
    profiles: ["flower"]
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  # Next.js demo UI (UI-001). Browser calls API via host port 8000.
  # Local host-native alternative: cd web && npm ci && npm run dev
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    # Lightweight liveness for compose UX (image has no curl/wget).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
  uploads_data:
