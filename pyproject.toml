[project]
name = "atlasops"
version = "0.1.0"
description = "AtlasOps AI — workspace-scoped RAG and incident investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
    "structlog>=24.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "tiktoken>=0.7.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.26.0",
    "pytest>=8.0.0",
    "testcontainers[postgres]>=4.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
